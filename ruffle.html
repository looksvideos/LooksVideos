<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ruffle Player</title>
</head>

<body>

<h1>RUFFLE PLAYER :D</h1>

<div id="player"></div>
<p id="status">Loading...</p>

<script>
    window.RufflePlayer = window.RufflePlayer || {};
</script>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<script>
window.addEventListener("load", function () {

    const params = new URLSearchParams(window.location.search);

    const videoUrl = params.get("url");

    const status = document.getElementById("status");
    const container = document.getElementById("player");

    if (!videoUrl) {
        status.textContent = "No SWF video URL was provided.";
        return;
    }

    const ruffle = window.RufflePlayer.newest();

    if (!ruffle) {
        status.textContent = "Ruffle failed to load.";
        return;
    }

    const player = ruffle.createPlayer();

    player.style.width = "800px";
    player.style.height = "600px";

    container.appendChild(player);

    player.load({
        url: videoUrl
    }).then(function () {

        status.textContent = "";

    }).catch(function (error) {

        console.error("Ruffle error:", error);

        status.textContent = "Ruffle could not load this SWF file.";

    });

});
</script>

</body>
</html>
