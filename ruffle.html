<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ruffle Player</title>
</head>

<body>

<h1>Ruffle Player</h1>

<div id="player"></div>
<p id="status">Loading video...</p>

<script>
    window.RufflePlayer = window.RufflePlayer || {};
</script>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<script type="module">
    import { supabase } from "./js/supabase-config.js";

    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("id");

    const status = document.getElementById("status");
    const playerContainer = document.getElementById("player");

    if (!videoId) {
        status.textContent = "No video ID was provided.";
    } else {
        const { data: video, error } = await supabase
            .from("videos")
            .select("id, title, storage_path, mime_type, visibility")
            .eq("id", videoId)
            .single();

        if (error) {
            console.error("Supabase error:", error);
            status.textContent = "Could not load video: " + error.message;
        } else if (!video) {
            status.textContent = "Video not found.";
        } else {
            const { data: file } = supabase.storage
                .from("videos")
                .getPublicUrl(video.storage_path);

            if (!file || !file.publicUrl) {
                status.textContent = "Could not get the video file URL.";
            } else {
                status.textContent = "Loading " + video.title + "...";

                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();

                player.style.width = "800px";
                player.style.height = "600px";

                playerContainer.appendChild(player);

                try {
                    await player.load({
                        url: file.publicUrl
                    });

                    status.textContent = "";
                } catch (err) {
                    console.error("Ruffle error:", err);
                    status.textContent = "Ruffle could not load this SWF file.";
                }
            }
        }
    }
</script>

</body>
</html>
