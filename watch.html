<main>

    <section>

        <div id="video-player">
        </div>

        <div id="video-info">

            <h1 id="video-title"></h1>

            <button id="like-button">Like</button>
            <button id="dislike-button">Dislike</button>

            <span id="views"></span>

        </div>

        <hr>

        <div id="uploader">

            <img id="uploader-avatar"
                 width="50"
                 height="50"
                 alt="Profile picture">

            <div>
                <a id="uploader-username"></a>
                <p>Uploaded by: <span id="uploaded-by"></span></p>
            </div>

        </div>

        <div id="description">
        </div>

        <hr>

        <section id="comments-section">

            <h2>Comments</h2>

            <form id="comment-form">
                <textarea id="comment-text"></textarea>
                <button type="submit">Comment</button>
            </form>

            <div id="comments">
            </div>

        </section>

    </section>


    <aside>

        <h2>Videos</h2>

        <div id="related-videos">
        </div>

    </aside>

</main>
